<!DOCTYPE html>
<html>
<head>
    <title>Prueba de Botones CRTLPyme</title>
    <script>
        async function testButtons() {
            const results = {
                timestamp: new Date().toISOString(),
                deployment_url: 'https://crtlpyme-ean57to77a-uc.a.run.app/admin-saas/tenants/cmhwiqm9t00e9upsz2cv1bwpa',
                tests: []
            };

            try {
                // Test 1: Verificar que la página carga
                const response = await fetch('https://crtlpyme-ean57to77a-uc.a.run.app/admin-saas/tenants/cmhwiqm9t00e9upsz2cv1bwpa');
                results.tests.push({
                    name: 'Página carga correctamente',
                    status: response.ok ? 'PASS' : 'FAIL',
                    statusCode: response.status
                });

                // Test 2: Verificar que hay contenido HTML
                const html = await response.text();
                const hasButtons = html.includes('Editar') && html.includes('Activar');
                results.tests.push({
                    name: 'Botones presentes en HTML',
                    status: hasButtons ? 'PASS' : 'FAIL',
                    details: `Editar: ${html.includes('Editar')}, Activar: ${html.includes('Activar')}`
                });

                // Test 3: Verificar código del botón Editar
                const hasEditHandler = html.includes('handleOpenEditDialog');
                results.tests.push({
                    name: 'Handler de Editar presente',
                    status: hasEditHandler ? 'PASS' : 'FAIL'
                });

                // Test 4: Verificar código del botón Activar
                const hasToggleHandler = html.includes('handleToggleActive');
                results.tests.push({
                    name: 'Handler de Activar presente',
                    status: hasToggleHandler ? 'PASS' : 'FAIL'
                });

                // Test 5: Verificar componente de mapa
                const hasMap = html.includes('TenantLocationMap') || html.includes('Geocodificando');
                results.tests.push({
                    name: 'Componente de mapa presente',
                    status: hasMap ? 'PASS' : 'FAIL'
                });

            } catch (error) {
                results.error = error.message;
            }

            document.getElementById('results').textContent = JSON.stringify(results, null, 2);
        }
    </script>
</head>
<body onload="testButtons()">
    <h1>Prueba Automatizada de Botones CRTLPyme</h1>
    <pre id="results">Ejecutando pruebas...</pre>
</body>
</html>
