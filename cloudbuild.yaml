steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/crtlpyme:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/crtlpyme:latest', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/crtlpyme:$COMMIT_SHA']
  
  # Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/crtlpyme:latest']
  
  # Deploy container image to Cloud Run with all secrets configured
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'crtlpyme'
      - '--image=gcr.io/$PROJECT_ID/crtlpyme:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--port=3000'
      # Configuración de variables de entorno desde secrets
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-secrets=NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest'
      - '--set-secrets=NEXTAUTH_URL=NEXTAUTH_URL:latest'
      - '--set-secrets=SENDGRID_API_KEY=SENDGRID_API_KEY:latest'
      - '--set-secrets=SENDGRID_FROM_EMAIL=SENDGRID_FROM_EMAIL:latest'
      - '--set-secrets=TRANSBANK_API_KEY=transbank-api-key:latest'
      - '--set-secrets=TRANSBANK_COMMERCE_CODE=transbank-commerce-code:latest'
      - '--set-secrets=TRANSBANK_ENVIRONMENT=TRANSBANK_ENVIRONMENT:latest'
      # Variables de entorno directas
      - '--set-env-vars=NODE_ENV=production'
      - '--set-env-vars=NEXT_PUBLIC_APP_NAME=CRTLPyme'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT_ID=$PROJECT_ID'

images:
  - 'gcr.io/$PROJECT_ID/crtlpyme:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/crtlpyme:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
